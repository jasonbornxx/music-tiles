<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Tiles Infinite</title>
    <style>
        /* --- RESET & LAYOUT --- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #222;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: manipulation; /* Improves touch response */
        }

        /* --- GAME CONTAINER --- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px; /* Phone width limit on desktop */
            height: 100vh;
            margin: 0 auto;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA); /* Sky blue gradient */
            display: flex;
            border-left: 2px solid #555;
            border-right: 2px solid #555;
        }

        /* --- LANES (Grid Lines) --- */
        .lane {
            flex: 1;
            height: 100%;
            border-right: 1px solid rgba(0,0,0,0.1);
        }
        .lane:last-child { border-right: none; }

        /* --- TILES --- */
        .tile {
            position: absolute;
            width: 25%; /* 1/4th of screen */
            height: 150px;
            background-color: #111;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
            top: -160px; /* Start off screen */
            z-index: 10;
            cursor: pointer;
        }
        
        /* Visual effect when clicked */
        .tile.clicked {
            background-color: rgba(255, 255, 255, 0.5);
            transition: background-color 0.1s, opacity 0.2s;
            opacity: 0;
        }

        .tile.wrong {
            background-color: #ff4444 !important;
            animation: shake 0.3s;
        }

        /* --- UI ELEMENTS --- */
        #score {
            position: absolute;
            top: 50px;
            width: 100%;
            text-align: center;
            font-size: 60px;
            color: #ff4081;
            text-shadow: 2px 2px 0 #fff;
            z-index: 20;
            pointer-events: none;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        h1 { font-size: 40px; margin-bottom: 10px; color: #00d2ff; }
        p { font-size: 18px; margin-bottom: 30px; color: #ddd; }
        
        button {
            padding: 15px 40px;
            font-size: 24px;
            background: #00d2ff;
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,210,255,0.4);
            cursor: pointer;
        }
        button:active { transform: scale(0.95); }

        .hidden { display: none !important; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Visual Grid Lines -->
        <div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div>

        <div id="score">0</div>

        <!-- Overlay Screens -->
        <div id="start-screen">
            <h1>Little Star</h1>
            <p>Music Tiles Demo</p>
            <button onclick="startGame()">PLAY</button>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1 style="color:#ff4444">Failed!</h1>
            <p>Score: <span id="final-score">0</span></p>
            <button onclick="resetGame()">RETRY</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GAME_HEIGHT = window.innerHeight;
        const TILE_HEIGHT = 150;
        const LANES = 4;
        
        // --- STATE ---
        let tiles = [];
        let score = 0;
        let speed = 5; // Starting speed (pixels per frame)
        let isGameOver = false;
        let animationId;
        let noteIndex = 0;
        let timeSinceLastSpawn = 0;
        let lastLane = -1;

        // --- AUDIO SYSTEM (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        // Frequencies for notes (C4 to A4)
        const NOTES = {
            'C': 261.63, 'D': 293.66, 'E': 329.63, 'F': 349.23,
            'G': 392.00, 'A': 440.00, 'B': 493.88
        };

        // "Twinkle Twinkle Little Star" Melody
        const MELODY = [
            'C','C','G','G','A','A','G',
            'F','F','E','E','D','D','C',
            'G','G','F','F','E','E','D',
            'G','G','F','F','E','E','D',
            'C','C','G','G','A','A','G',
            'F','F','E','E','D','D','C'
        ];

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playNote(noteChar) {
            if (!audioCtx) return;
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'triangle'; // Piano-ish waveform
            osc.frequency.setValueAtTime(NOTES[noteChar], audioCtx.currentTime);
            
            // Envelope (fade out)
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // --- GAME LOGIC ---

        function startGame() {
            initAudio();
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            
            score = 0;
            speed = 5; // Reset speed
            noteIndex = 0;
            isGameOver = false;
            tiles = [];
            document.getElementById('score').innerText = score;
            
            // Clear existing tiles from DOM
            const existingTiles = document.querySelectorAll('.tile');
            existingTiles.forEach(t => t.remove());

            // Spawn initial tiles to fill screen
            spawnTile(-150); 
            spawnTile(-450);
            spawnTile(-750);

            gameLoop();
        }

        function resetGame() {
            startGame();
        }

        function spawnTile(yPos) {
            const container = document.getElementById('game-container');
            const tile = document.createElement('div');
            
            // Random Lane (0 to 3), but try not to repeat same lane too often
            let lane;
            do {
                lane = Math.floor(Math.random() * LANES);
            } while (lane === lastLane && Math.random() > 0.3); // 30% chance to allow repeat
            lastLane = lane;

            tile.classList.add('tile');
            tile.style.left = (lane * 25) + '%';
            tile.style.top = yPos + 'px';
            
            // Assign the note for this tile
            tile.dataset.note = MELODY[noteIndex % MELODY.length];
            noteIndex++; // Prepare next note index, but don't advance main loop yet

            // Touch/Click Event
            const handleTap = (e) => {
                e.preventDefault(); // Prevent phantom clicks
                e.stopPropagation(); // Stop event bubbling to container

                if (isGameOver || tile.classList.contains('clicked')) return;

                // Success Logic
                tile.classList.add('clicked');
                playNote(tile.dataset.note);
                
                score++;
                document.getElementById('score').innerText = score;

                // INCREASE DIFFICULTY
                // Every 10 points, increase speed slightly
                if (score % 10 === 0) {
                    speed += 0.5;
                }
            };

            tile.addEventListener('touchstart', handleTap, {passive: false});
            tile.addEventListener('mousedown', handleTap);

            container.appendChild(tile);
            tiles.push({ element: tile, y: yPos, active: true });
        }

        function triggerGameOver() {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            
            // Play a distinct "fail" sound
            if(audioCtx) {
                const osc = audioCtx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                osc.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }

            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // Container click listener for "Missed Clicks"
        const container = document.getElementById('game-container');
        const handleMiss = (e) => {
            if (isGameOver) return;
            // If user clicked container but NOT a tile (bubbling would be stopped by tile)
            // Or if they clicked an already clicked tile (logic handled inside tile event)
            if(!e.target.classList.contains('tile') || e.target.classList.contains('clicked')) {
               triggerGameOver(); 
            }
        };
        container.addEventListener('mousedown', handleMiss);
        container.addEventListener('touchstart', handleMiss);


        function gameLoop() {
            if (isGameOver) return;

            // Move Tiles
            let lowestTileY = -Infinity;
            let highestTileY = Infinity;

            for (let i = 0; i < tiles.length; i++) {
                let t = tiles[i];
                
                t.y += speed;
                t.element.style.top = t.y + 'px';

                // Track positions for spawning logic
                if (t.y > lowestTileY) lowestTileY = t.y;
                if (t.y < highestTileY) highestTileY = t.y;

                // Check Game Over (Tile hit bottom without being clicked)
                if (t.active && t.y > GAME_HEIGHT - 20) { // -20 serves as a buffer zone
                    t.element.classList.add('wrong'); // Visual feedback
                    triggerGameOver();
                    return;
                }

                // Garbage Collection (Remove clicked tiles that fell off screen)
                if (!t.active && t.y > GAME_HEIGHT) {
                    t.element.remove();
                    tiles.splice(i, 1);
                    i--;
                }
                
                // Update active status based on class (if user clicked it)
                if(t.element.classList.contains('clicked')) {
                    t.active = false;
                }
            }

            // Spawning Logic: Ensure there is always a tile coming
            // If the highest tile has moved down enough, spawn a new one above it
            // "Enough" is calculated to ensure gaps aren't too huge
            if (highestTileY > -TILE_HEIGHT) {
                spawnTile(highestTileY - TILE_HEIGHT); 
            }

            animationId = requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
